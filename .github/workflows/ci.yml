name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The engine dependency: guard-core-jvm pinned at db716ec (full SHA for the
      # actions/checkout fetch), checked
      # out as the sibling directory ./guard-core-jvm and substituted for the
      # declared com.guardcore:guard-core coordinates by settings.gradle.kts.
      - name: Checkout engine (guard-core-jvm @ db716ec)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/guard-core-jvm
          ref: db716ec0a038fa3dd0a145211bf6a1f18c178d03
          path: guard-core-jvm
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # TODO: wire gradle/actions/wrapper-validation here once an in-org repo
      # pins a SHA for it; no Guard-Core repo references it yet.

      # The redis-backed integration tests (rate limiting through the facade
      # RateLimitManager) need Redis; they skip when it is unreachable.
      - name: Start Redis
        run: |
          docker run -d --name guard-redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec guard-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Stop Redis
        if: always()
        run: docker rm -f guard-redis || true

  ci:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Aggregate result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "build job finished with: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All CI jobs passed"

  dependency-audit:
    name: Dependency audit (osv-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The family-equivalent of govulncheck / cargo audit (the spec 14.1
      # dependency-auditing row): the OSV database aggregates the same
      # advisory sources, and it scans the committed gradle.lockfile (gradle
      # dependency locking) - the JVM frozen-lockfile analog. Any known
      # vulnerability fails the job; suppression goes through a reasoned
      # osv-scanner.toml, never by disabling the scan.
      - name: Install osv-scanner (v2.6.0, checksum-pinned)
        run: |
          curl --fail --silent --show-error --location \
            -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /usr/local/bin/osv-scanner" | sha256sum --check -
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan the committed lockfile
        run: |
          osv-scanner scan --config osv-scanner.toml --lockfile gradle.lockfile
