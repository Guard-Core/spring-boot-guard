version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-deps:
        patterns:
          - "*"
ignore:
  - dependency-name: "org.springframework.boot:spring-boot-dependencies"
    update-types: ["version-update:semver-major"]
